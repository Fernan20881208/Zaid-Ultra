name: Build Android64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ROOT replay audio helper
        run: bash tools/build-replay-audio-helper.sh

      - name: Build Zaid-Ultra
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          build-config: Release
          use-lto: true

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Ultra-Android64
          path: ${{ steps.build.outputs.build-output }}
