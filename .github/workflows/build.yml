name: Build Zaid-Ultra

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-22.04
            target: Android64
          - name: Android32
            os: ubuntu-22.04
            target: Android32
          - name: Windows
            os: windows-latest
            target: Win64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.config.target }}
          build-config: Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Ultra-${{ matrix.config.name }}
          path: ${{ steps.build.outputs.build-output }}
