name: Build Casa Arlette asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild house image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gdevelop-assets/casa-arlette
          cat .casa-arlette-parts/part-* > /tmp/house.b64
          base64 -d /tmp/house.b64 > gdevelop-assets/casa-arlette/house-arlette.webp
          rm -rf .casa-arlette-parts
          rm -f .github/workflows/build-casa-arlette-asset.yml
      - name: Commit asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Casa Arlette house asset" || exit 0
          git push
