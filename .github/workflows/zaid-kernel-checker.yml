name: Zaid Kernel Checker APK

on:
  push:
    branches: [main]
    paths:
      - 'Zaid-Kernel-Checker/**'
      - '.github/workflows/zaid-kernel-checker.yml'
  pull_request:
    paths:
      - 'Zaid-Kernel-Checker/**'
      - '.github/workflows/zaid-kernel-checker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker:
    name: Compilar APK separado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Zaid-Kernel-Checker
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prueba ELF del modulo
        run: |
          mkdir -p build/standalone-tests
          javac -d build/standalone-tests app/src/main/java/com/zaid/kernelchecker/ModuleInspector.java tests/ModuleInspectorTest.java
          java -cp build/standalone-tests ModuleInspectorTest
      - name: Compilar checker
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Kernel-Checker-APK
          path: Zaid-Kernel-Checker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
