name: Build GFN4K LSPosed APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'GFN4K-LSPosed/**'
      - '.github/workflows/gfn4k-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build LSPosed APK
        working-directory: GFN4K-LSPosed
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s GFN4K-LSPosed/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GFN4K-ATV-LSPosed-0.2.0
          path: GFN4K-LSPosed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
