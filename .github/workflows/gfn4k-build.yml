name: Build GFN4K LSPosed APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'GFN4K-LSPosed/**'
      - '.github/workflows/gfn4k-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: cd GFN4K-LSPosed && gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GFN4K-ATV-LSPosed-0.2.0
          path: GFN4K-LSPosed/app/build/outputs/apk/debug/app-debug.apk
