name: Build Galaxy A17 kernel 6.12 (real sources)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Etapa que se debe intentar"
        type: choice
        required: true
        default: kernel_and_probe
        options:
          - prepare
          - kernel
          - kernel_and_probe
      source_release_tag:
        description: "Tag de Release con los 2 ZIP Samsung originales"
        type: string
        required: true
        default: a17-samsung-sources
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: a17-samsung-kernel-build
  cancel-in-progress: false

jobs:
  compile:
    if: github.event_name != 'release' || github.event.release.tag_name == 'a17-samsung-sources'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      A17_WORKDIR: ${{ runner.temp }}/a17-kernel-work
      A17_REPORT_DIR: ${{ github.workspace }}/a17-ci-results
      SOURCE_TAG: ${{ inputs.source_release_tag || 'a17-samsung-sources' }}
      BUILD_MODE: ${{ inputs.mode || 'kernel_and_probe' }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git git-lfs curl python3 rsync unzip tar xz-utils bc bison flex \
            libssl-dev libelf-dev libncurses-dev dwarves cpio zip zstd \
            build-essential cmake ninja-build clang lld binutils file kmod
          mkdir -p "$A17_REPORT_DIR"
          df -h . | tee "$A17_REPORT_DIR/disk-at-start.txt"
      - name: Download exact Samsung original source ZIPs from release
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/a17-input-sources"
          mkdir -p "$SRC"
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" --dir "$SRC" \
            --pattern 'SM-A175F_16_Opensource.zip' \
            --pattern 'SM-A175F_16_Opensource_A175FXXS7CZI4_A175NKSS7CZI2.zip'
          test -s "$SRC/SM-A175F_16_Opensource.zip"
          test -s "$SRC/SM-A175F_16_Opensource_A175FXXS7CZI4_A175NKSS7CZI2.zip"
          {
            echo '4fa6e41f63151728277f49842d3fe1d59d6cfaaf853a161c7c2ed98f906727dd  '"$SRC"'/SM-A175F_16_Opensource.zip'
            echo '643bde1afbf8dd17f98962314245818a0057ed46d6a22503f7ddeacd0478495b  '"$SRC"'/SM-A175F_16_Opensource_A175FXXS7CZI4_A175NKSS7CZI2.zip'
          } | sha256sum --check
      - name: Prepare, build Samsung kernel and optional ARM64 compatibility probe
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/a17-input-sources"
          bash RTDriver-A17/scripts/ci_build_a17.sh \
            "$SRC/SM-A175F_16_Opensource.zip" \
            "$SRC/SM-A175F_16_Opensource_A175FXXS7CZI4_A175NKSS7CZI2.zip" \
            "$BUILD_MODE"
      - name: Upload logs and verified artifacts (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a17-6.12-build-report-${{ github.run_number }}
          path: a17-ci-results/
          if-no-files-found: warn
          retention-days: 14
