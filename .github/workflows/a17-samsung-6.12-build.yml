name: Build Galaxy A17 kernel 6.12 (MediaFire sources)

on:
  push:
    branches: [main]
    paths:
      - 'RTDriver-A17/build-requests/rt-diag-*.json'
      - 'RTDriver-A17/build-requests/rt-port-*.json'
  workflow_dispatch:
    inputs:
      mode:
        description: "Etapa de compilacion"
        type: choice
        required: true
        default: preflight
        options:
          - prepare
          - preflight
          - kernel
          - kernel_and_probe
          - kernel_and_rt_diag
          - kernel_and_rt_port
  # A separate explicit request file triggers one build. Ordinary source
  # commits never trigger a kernel compile. Static checks and --nobuild gate it.

permissions:
  contents: read

concurrency:
  group: a17-samsung-6.12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/a17-rt-static.yml
  compile:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      A17_REPORT_DIR: ${{ github.workspace }}/a17-ci-results
      BUILD_MODE: ${{ github.event_name == 'push' && 'request' || inputs.mode }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve one explicit RT build request
        if: github.event_name == 'push'
        shell: bash
        run: python3 RTDriver-A17/scripts/resolve_rt_build_request.py >> "$GITHUB_ENV"

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git git-lfs curl python3 rsync unzip tar xz-utils bc bison flex \
            libssl-dev libelf-dev libncurses-dev dwarves cpio zip zstd \
            build-essential cmake ninja-build clang lld binutils file kmod
          mkdir -p "$A17_REPORT_DIR"
          df -h . | tee "$A17_REPORT_DIR/disk-at-start.txt"
          git rev-parse HEAD > "$A17_REPORT_DIR/source-commit.txt"

      - name: Download from MediaFire and verify original SHA-256
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/a17-input-sources"
          mkdir -p "$SRC" "$A17_REPORT_DIR"
          python3 RTDriver-A17/scripts/download_mediafire_sources.py \
            --out-dir "$SRC" 2>&1 | tee "$A17_REPORT_DIR/mediafire-download.log"
          test -s "$SRC/SM-A175F_16_Opensource.zip"
          test -s "$SRC/SM-A175F_16_Opensource_A175FXXS7CZI4_A175NKSS7CZI2.zip"
          sha256sum "$SRC"/SM-A175F*.zip > "$A17_REPORT_DIR/source-sha256.txt"

      - name: Prepare source tree and optionally compile kernel and ARM64 probe
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/a17-input-sources"
          bash RTDriver-A17/scripts/ci_build_a17.sh \
            "$SRC/SM-A175F_16_Opensource.zip" \
            "$SRC/SM-A175F_16_Opensource_A175FXXS7CZI4_A175NKSS7CZI2.zip" \
            "$BUILD_MODE"

      - name: Upload diagnostic logs and verified outputs even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a17-mediafire-build-report-${{ github.run_number }}
          path: a17-ci-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize actual verification result
        if: always()
        shell: bash
        run: |
          if [[ -f "$A17_REPORT_DIR/rt-diag-report.md" ]]; then
            cat "$A17_REPORT_DIR/rt-diag-report.md" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f "$A17_REPORT_DIR/status.txt" ]]; then
            cat "$A17_REPORT_DIR/status.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$A17_REPORT_DIR/rt-port-report.md" ]]; then
            cat "$A17_REPORT_DIR/rt-port-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
