name: Build ARM32 TV Inspector APK

on:
  push:
    branches: [arm32-tv-inspector]
    paths:
      - 'GhostLock-ARM32-TV/**'
      - '.github/workflows/arm32-tv-inspector.yml'
  workflow_dispatch:

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: GhostLock-ARM32-TV
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 35
        shell: bash
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: ARM32-TV-Inspector-debug-APK
          path: GhostLock-ARM32-TV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
