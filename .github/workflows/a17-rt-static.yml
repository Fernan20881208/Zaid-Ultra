name: A17 RT Port - static validation
on:
  push:
    paths:
      - 'RTDriver-A17/**'
      - 'collect_a17_buildinfo.sh'
      - '.github/workflows/a17-rt-static.yml'
      - '.github/workflows/a17-samsung-6.12-build.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and scope checks (no kernel driver compiled)
        shell: bash
        run: |
          set -euo pipefail
          bash -n RTDriver-A17/scripts/build_probe.sh
          bash -n RTDriver-A17/scripts/prepare_official_a17.sh
          bash -n RTDriver-A17/scripts/ci_build_a17.sh
          bash -n RTDriver-A17/scripts/probe_preflight.sh
          bash -n RTDriver-A17/scripts/test_probe_makefile.sh
          bash RTDriver-A17/scripts/test_probe_makefile.sh
          cc -std=c11 -Wall -Wextra -Werror RTDriver-A17/rt_port/tests/test_abi.c -o "$RUNNER_TEMP/a17-rt-abi"
          "$RUNNER_TEMP/a17-rt-abi"
          cc -D_GNU_SOURCE -std=gnu11 -Wall -Wextra -Werror RTDriver-A17/rt_port/tools/rt_a17_status.c -o "$RUNNER_TEMP/a17-rt-status"
          grep -Fq '.original_ioctls_implemented = 0' RTDriver-A17/rt_port/rt_a17_diag.c
          grep -Fq 'return -EOPNOTSUPP;' RTDriver-A17/rt_port/rt_a17_diag.c
          bash -n RTDriver-A17/rt_port/tests/test_makefile.sh
          bash RTDriver-A17/rt_port/tests/test_makefile.sh
          bash -n RTDriver-A17/rt_port/collect_diag.sh
          bash -n RTDriver-A17/rt_port/tests/test_collect_diag.sh
          bash RTDriver-A17/rt_port/tests/test_collect_diag.sh
          grep -Fq 'kernel_and_rt_diag' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'RTDriver-A17/rt_port/collect_diag.sh' RTDriver-A17/scripts/ci_build_a17.sh
          test -f RTDriver-A17/rt_port/BUILD.bazel
          test -f RTDriver-A17/rt_port/rt_a17_diag.c
          bash -n RTDriver-A17/scripts/configure_stock_release.sh
          bash -n RTDriver-A17/scripts/test_stock_release.sh
          bash RTDriver-A17/scripts/test_stock_release.sh
          bash -n RTDriver-A17/scripts/verify_module_crc.sh
          grep -Fq 'configure_stock_release.sh' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'verify_module_crc.sh' RTDriver-A17/scripts/ci_build_a17.sh
          bash -n RTDriver-A17/scripts/collect_probe_artifact.sh
          bash -n RTDriver-A17/scripts/test_collect_probe_artifact.sh
          bash RTDriver-A17/scripts/test_collect_probe_artifact.sh
          grep -Fq 'build --nobuild --config=stamp' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'source ./kernel_device_modules-6.12/kernel/kleaf/_setup_env.sh' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'mgk_64_k612_kernel_aarch64[.]user/Module[.]symvers' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'collect_probe_artifact.sh' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'a17_compat_probe/a17_compat_probe/a17_compat_probe.ko' RTDriver-A17/scripts/collect_probe_artifact.sh
          grep -Fq 'modinfo -F vermagic' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'modinfo -F signer' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'case "$A17_STAGE" in prepare|preflight|kernel|kernel_and_probe|kernel_and_rt_diag|kernel_and_rt_port)' RTDriver-A17/scripts/ci_build_a17.sh
          grep -q 'A17_STAGE="\$3"' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'if [[ "$A17_STAGE" == "kernel_and_probe" ]]' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'export KERNEL_VERSION="kernel-6.12"' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'export KERNEL_BUILD_VARIANT="$MODE"' RTDriver-A17/scripts/ci_build_a17.sh
          grep -Fq 'if [[ "$A17_STAGE" == "kernel_and_probe" && ! -s "$REPORT/a17_compat_probe.ko" ]]' RTDriver-A17/scripts/ci_build_a17.sh
          if grep -Eq 'if \[\[ "\$MODE" == "(prepare|kernel_and_probe)"' RTDriver-A17/scripts/ci_build_a17.sh; then
            echo 'ERROR: Samsung MODE=user would disable requested CI stage' >&2
            exit 1
          fi
          bash -n RTDriver-A17/scripts/fetch_bazel_common_rules.sh
          bash -n RTDriver-A17/scripts/integrate_aosp_deps.sh
          bash -n RTDriver-A17/scripts/test_integrate_aosp_deps.sh
          bash RTDriver-A17/scripts/test_integrate_aosp_deps.sh
          grep -q 'mgk_64_k612_kernel_aarch64.user' RTDriver-A17/src/BUILD.bazel
          bash -n collect_a17_buildinfo.sh
          python3 -m py_compile RTDriver-A17/scripts/apply_samsung_czi4.py
          python3 -m py_compile RTDriver-A17/scripts/inspect_a17_source_bundle.py
          python3 -m py_compile RTDriver-A17/scripts/download_mediafire_sources.py
          python3 -m py_compile RTDriver-A17/scripts/verify_rt_diag.py
          bash RTDriver-A17/rt_port/tests/test_status.sh
          bash RTDriver-A17/rt_port/tests/test_runtime.sh
          bash RTDriver-A17/rt_port/tests/test_port_status.sh
          bash -n RTDriver-A17/rt_port/collect_runtime.sh
          bash RTDriver-A17/rt_port/tests/test_collect_runtime.sh
          bash RTDriver-A17/scripts/test_verify_module_crc.sh
          (cd RTDriver-A17/scripts && python3 -m unittest test_verify_rt_diag -v)
          (cd RTDriver-A17/scripts && python3 -m unittest test_resolve_rt_build_request -v)
          (cd RTDriver-A17/scripts && python3 -m unittest test_mediafire_sources -v)
          python3 RTDriver-A17/scripts/inspect_a17_source_bundle.py --help >/dev/null
          python3 RTDriver-A17/scripts/apply_samsung_czi4.py --help >/dev/null
          grep -q "6.12.38-android16-5-abA175FXXS7CZI4-4k" RTDriver-A17/scripts/build_probe.sh
          grep -q 'obj-m' RTDriver-A17/src/Makefile
          echo 'Static checks passed; THIS IS NOT a compiled RT Driver.'
      - name: Check actual upstream Bazel common rules source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch main \
            https://android.googlesource.com/platform/build/bazel_common_rules \
            "$RUNNER_TEMP/bazel-common"
          test "$(git -C "$RUNNER_TEMP/bazel-common" rev-parse HEAD)" = "b1a2840cb13746f94e4c88e7e28d308f51f87804"
          test -f "$RUNNER_TEMP/bazel-common/dist/dist.bzl"
          test -f "$RUNNER_TEMP/bazel-common/dist/BUILD" || \
            test -f "$RUNNER_TEMP/bazel-common/dist/BUILD.bazel"
          echo "Authentic pinned AOSP Bazel dist package verified."
